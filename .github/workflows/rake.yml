name: rake

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  rake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: sudo apt-get install -y graphviz
      - run: dot -V
      - run: bundle exec rake
      - run: bundle exec rake verify
      - name: Diagnose iso render
        if: failure()
        run: |
          set -x
          file iso/images/IsoBibliographicItem*.png
          head -3 iso/images/IsoBibliographicItem.png
          bundle exec lutaml-lml generate iso/models/IsoBibliographicItem.lml -o /tmp/iso.dot -t dot
          dot -Tpng /tmp/iso.dot -o /tmp/iso-manual.png; echo "manual dot rc=$?"
          file /tmp/iso-manual.png
          dot -Tpng -Gsplines=polyline /tmp/iso.dot -o /tmp/iso-poly.png; echo "poly rc=$?"
          file /tmp/iso-poly.png
          dot -Tsvg /tmp/iso.dot -o /tmp/iso-manual.svg; echo "svg rc=$?"
          file /tmp/iso-manual.svg
      - run: bundle exec rake parity

  # Regeneration parity gate: committed .rng must be byte-identical to
  # regeneration from the pinned submodule sources.
  grammar-parity:
    runs-on: ubuntu-latest
    steps:
      # Non-recursive: basicdoc-models and relaton-models submodule each
      # other, so recursive checkout would chase the cycle. The build only
      # needs the three direct pins.
      - uses: actions/checkout@v4
      - run: git submodule update --init grammars/relaton-models grammars/basicdoc-models grammars/metanorma-requirements-models
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # trang is resolved by make.sh: TRANG_JAR env -> PATH -> pinned
      # jing-trang V20241231 build under grammars/vendor/ (needs ant).
      - run: sudo apt-get update && sudo apt-get install -y ant
      - run: cd grammars && ./make.sh
      # Only committed artifacts are in the parity gate; vendored inputs and
      # versions.json are gitignored.
      - run: git diff --exit-code -- grammars/*.rng grammars/*.rnc
