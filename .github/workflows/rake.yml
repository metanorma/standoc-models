name: rake

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  rake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: sudo apt-get install -y graphviz
      - run: bundle exec rake
      - run: bundle exec rake verify
      - name: Bisect iso render (TEMP)
        if: failure()
        run: |
          W="$PWD"
          mk() { sed "s|include iso_document/|include $W/iso/models/iso_document/|g" iso/models/IsoBibliographicItem.lml > /tmp/$1.lml; }
          # v1: as-is (absolute includes)
          mk v1
          # v2: plus the StandardBibDataExtensionType include
          mk v2; sed -i "s|include $W/iso/models/iso_document/metadata/IsoBibliographicItem.lml|include $W/iso/models/standard_document/metadata/StandardBibDataExtensionType.lml\n  include $W/iso/models/iso_document/metadata/IsoBibliographicItem.lml|" /tmp/v2.lml
          # v3: TypeUri -> TypedUri
          mk v3; sed -i 's|TypeUri|TypedUri|g' /tmp/v3.lml
          # v4: no associations at all (parse classes only)
          mk v4; sed -i '/association {/,/^  }$/d' /tmp/v4.lml
          # v5: associations only (no includes)
          mk v5; sed -i '/include /d' /tmp/v5.lml
          for v in v1 v2 v3 v4 v5; do
            bundle exec lutaml-lml generate /tmp/$v.lml -o /tmp/$v.dot -t dot 2>&1 | grep -v '^$' | tail -2
            echo "== $v: $(wc -c < /tmp/$v.dot) bytes"
          done
      - run: bundle exec rake parity

  # Regeneration parity gate: committed .rng must be byte-identical to
  # regeneration from the pinned submodule sources.
  grammar-parity:
    runs-on: ubuntu-latest
    steps:
      # Non-recursive: basicdoc-models and relaton-models submodule each
      # other, so recursive checkout would chase the cycle. The build only
      # needs the three direct pins.
      - uses: actions/checkout@v4
      - run: git submodule update --init grammars/relaton-models grammars/basicdoc-models grammars/metanorma-requirements-models
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # trang is resolved by make.sh: TRANG_JAR env -> PATH -> pinned
      # jing-trang V20241231 build under grammars/vendor/ (needs ant).
      - run: sudo apt-get update && sudo apt-get install -y ant
      - run: cd grammars && ./make.sh
      # Only committed artifacts are in the parity gate; vendored inputs and
      # versions.json are gitignored.
      - run: git diff --exit-code -- grammars/*.rng grammars/*.rnc
