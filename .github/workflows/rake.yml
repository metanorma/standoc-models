name: rake

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  rake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: sudo apt-get install -y graphviz
      - run: bundle exec rake
      - run: bundle exec rake verify
      - name: Bisect iso render (TEMP)
        if: failure()
        run: |
          set -e
          mkdir -p /tmp/bisect
          # v1: as-is
          cp iso/models/IsoBibliographicItem.lml /tmp/bisect/v1.lml
          # v2: ../models-style include paths (relaton convention)
          sed 's|include iso_document/|include iso/models/iso_document/|' iso/models/IsoBibliographicItem.lml > /tmp/bisect/v2.lml
          # v3: add the StandardBibDataExtensionType include (relaton's extra node)
          sed 's|include iso_document/metadata/IsoBibliographicItem.lml|include iso/models/standard_document/metadata/StandardBibDataExtensionType.lml\n  include iso_document/metadata/IsoBibliographicItem.lml|' iso/models/IsoBibliographicItem.lml > /tmp/bisect/v3.lml
          # v4: TypeUri -> TypedUri
          sed 's|TypeUri|TypedUri|g' iso/models/IsoBibliographicItem.lml > /tmp/bisect/v4.lml
          # v5: rendered from inside iso/models (cwd variation)
          cp iso/models/IsoBibliographicItem.lml /tmp/bisect/v5.lml
          cd iso/models && bundle exec lutaml-lml generate /tmp/bisect/v5.lml -o /tmp/bisect/v5.dot -t dot; wc -c < /tmp/bisect/v5.dot; cd ../..
          for v in v1 v2 v3 v4; do
            cp -r iso/models/iso_document /tmp/bisect/iso_document 2>/dev/null || true
            cp -r iso/models/standard_document /tmp/bisect/standard_document 2>/dev/null || true
            ( cd /tmp/bisect && bundle exec --gemfile "$GITHUB_WORKSPACE/Gemfile" lutaml-lml generate $v.lml -o $v.dot -t dot 2>&1 | tail -1; echo "$v: $(wc -c < $v.dot) bytes" )
          done
      - run: bundle exec rake parity

  # Regeneration parity gate: committed .rng must be byte-identical to
  # regeneration from the pinned submodule sources.
  grammar-parity:
    runs-on: ubuntu-latest
    steps:
      # Non-recursive: basicdoc-models and relaton-models submodule each
      # other, so recursive checkout would chase the cycle. The build only
      # needs the three direct pins.
      - uses: actions/checkout@v4
      - run: git submodule update --init grammars/relaton-models grammars/basicdoc-models grammars/metanorma-requirements-models
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # trang is resolved by make.sh: TRANG_JAR env -> PATH -> pinned
      # jing-trang V20241231 build under grammars/vendor/ (needs ant).
      - run: sudo apt-get update && sudo apt-get install -y ant
      - run: cd grammars && ./make.sh
      # Only committed artifacts are in the parity gate; vendored inputs and
      # versions.json are gitignored.
      - run: git diff --exit-code -- grammars/*.rng grammars/*.rnc
