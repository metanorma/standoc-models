name: Build and Deploy Grammars

# Model catalogue + LXR grammar-package/SPA generation for EVERY flavour,
# deployed to GitHub Pages (one directory per flavour). One root Gemfile
# (lutaml-lml + lutaml-xsd + ruby-jing); each flavour directory carries only
# its build-config.yml schema set. The flavour list comes from flavors.txt —
# the same single source the root Rakefile and the metanorma/ci path-filter
# read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Vendor submodule grammars
        run: ruby scripts/vendor-submodule-grammars.rb

      - name: Build LXR packages and SPA documentation
        run: |
          set -e
          while read -r flavor; do
            [ -n "$flavor" ] || continue
            echo "::group::LXR $flavor"
            ( cd "$flavor"
              bundle exec lutaml-xsd build from-config build-config.yml --output "$flavor.lxr"
              bundle exec lutaml-xsd spa "$flavor.lxr" --mode inlined --output "$flavor.html"
              mkdir -p "_site/$flavor"
              cp "$flavor.html" "_site/$flavor/index.html"
              cp -r images "_site/$flavor/" 2>/dev/null || true )
            echo "::endgroup::"
          done < flavors.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lxr-sites
          path: |
            */_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (site generator + flavour metadata)
        uses: actions/checkout@v6
      - name: Download flavour artifacts
        uses: actions/download-artifact@v5
        with:
          path: _artifacts
          pattern: lxr-*
      - name: Assemble site
        run: |
          # Catalogue first (creates _site/ with committed diagrams, the
          # JSON Schema and the instance fixtures), then overlay the
          # per-flavour LXR SPA directories.
          ruby site/generate.rb
          cp -r _artifacts/*/_site/* _site/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
